<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eaef;--sf:#fff;--sf2:#f1f2f6;--tx:#1d2029;--mu:#5d6475;--ac:#8a6a1c;--acb:#c9a24b;--acx:#1d2029;--rd:#a8382e;--bd:#cdd1db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161922;--sf:#212633;--sf2:#2a3040;--tx:#e8e3d6;--mu:#9aa1b3;--ac:#d4af5a;--acb:#c9a24b;--acx:#1a1708;--rd:#d9604f;--bd:#363d50}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161922;--sf:#212633;--sf2:#2a3040;--tx:#e8e3d6;--mu:#9aa1b3;--ac:#d4af5a;--acb:#c9a24b;--acx:#1a1708;--rd:#d9604f;--bd:#363d50}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 "Alegreya Sans",system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font:800 1.5rem Cinzel,Georgia,serif;margin:4px 0 12px;letter-spacing:.02em}
h2{font:600 1.1rem Cinzel,Georgia,serif;margin:18px 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{flex:1;white-space:nowrap;background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:10px 14px;border-radius:8px;font:600 .95rem Cinzel,Georgia,serif;cursor:pointer}
nav button[aria-selected=true]{background:var(--acb);color:var(--acx);border-color:var(--acb)}
section{display:none}section.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acb);color:var(--acx);border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.ghost{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.danger{background:none;border:0;color:var(--rd);font-weight:700}
input,textarea{font:inherit;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-size:.85rem;color:var(--mu);flex:1;min-width:110px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dice button{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:14px 0;font:800 1.05rem Cinzel,Georgia,serif}
.dice button.sel{background:var(--acb);color:var(--acx);border-color:var(--acb)}
#res{font:800 3.2rem Cinzel,Georgia,serif;color:var(--ac);text-align:center;min-height:1.3em}
#resd{text-align:center;color:var(--mu);min-height:1.4em}
.mu{color:var(--mu)}
.abs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ab{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:var(--sf2);border-radius:8px;padding:8px}
.ab span{font-weight:700}.ab b{font-size:1.2rem;color:var(--ac)}
.ab input{width:60px}.ab button{grid-column:1/4}
.hpb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hpb input{width:76px}
.it{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;background:var(--sf)}
.it.cur{border-color:var(--acb);box-shadow:0 0 0 2px var(--acb)}
.it .nm{flex:1;min-width:0;font-weight:700}
.it input{width:64px}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:700}
.q{display:flex;gap:10px;align-items:center;padding:6px 0}.q input[type=checkbox]{width:22px;height:22px}
.done{text-decoration:line-through;color:var(--mu)}
.pcode{font:800 2.6rem Cinzel,Georgia,serif;letter-spacing:.18em;color:var(--ac);text-align:center;padding:6px 0}
select{font:inherit;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.fd{padding:4px 0;border-bottom:1px solid var(--bd)}.fd:last-child{border-bottom:0}
.pm{padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;background:var(--sf)}
.pm .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:var(--sf2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acb)}
.bar i.low{background:var(--rd)}
.off{opacity:.55}
.q .ghost,.pm .ghost{padding:5px 9px;font-size:.85rem}
/* player view: joined players get a smaller, party-first app; the gate shows only the party code screen */
body[data-role=gate] nav,body[data-role=gate] main>section:not(#party){display:none!important}
body[data-role=player] nav [data-tab=combat],body[data-role=player] nav [data-tab=tools],body[data-role=player] #combat,body[data-role=player] #tools,body[data-role=player] #questbox,body[data-role=player] [data-shn],body[data-role=player] [data-shq]{display:none!important}
body[data-role=player] .btn,body[data-role=player] .ghost{padding:13px 16px;font-size:1.05rem}
body[data-role=player] nav button{padding:13px 10px}
body[data-role=player] input,body[data-role=player] select,body[data-role=player] textarea{padding:12px;font-size:1.05rem}
body[data-role=player] .dice button{padding:18px 0}
#hist div{padding:3px 0;border-bottom:1px solid var(--bd);color:var(--mu);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Table Companion</h1>
<nav role="tablist">
<button role="tab" data-tab="dice" aria-selected="true">Dice</button>
<button role="tab" data-tab="char" aria-selected="false">Character</button>
<button role="tab" data-tab="combat" aria-selected="false">Combat</button>
<button role="tab" data-tab="camp" aria-selected="false">Campaign</button>
<button role="tab" data-tab="party" aria-selected="false">Party</button>
<button role="tab" data-tab="tools" aria-selected="false">Tools</button>
</nav>

<section id="dice" class="on">
<div class="card">
<div id="res">–</div><div id="resd">Pick a die and roll</div>
</div>
<div class="card">
<div class="dice" id="dgrid"></div>
<div class="row" style="margin-top:12px">
<label>How many<input id="dn" type="number" min="1" max="20" value="1"></label>
<label>Modifier<input id="dm" type="number" value="0"></label>
</div>
<div class="row">
<button class="btn" data-act="roll">Roll</button>
<button class="ghost" data-act="adv">Advantage (d20)</button>
<button class="ghost" data-act="dis">Disadvantage (d20)</button>
</div>
</div>
<h2>Recent rolls</h2><div id="hist" class="card"></div>
</section>

<section id="char"></section>

<section id="combat">
<div class="card">
<div class="row">
<label>Name<input id="cn" placeholder="Goblin 1"></label>
<label>Initiative<input id="ci" type="number" placeholder="14"></label>
<label>HP<input id="ch" type="number" placeholder="7"></label>
</div>
<div class="row"><button class="btn" data-act="addc">Add combatant</button><button class="ghost" data-act="rollinit">Roll d20 for initiative</button></div>
</div>
<div class="row"><b id="rnd"></b><button class="btn" data-act="next">Next turn</button><button class="ghost" data-act="resetc">Clear encounter</button></div>
<div id="clist"></div>
</section>

<section id="camp">
<div class="card">
<label>Session title<input id="nt" placeholder="Session 1: The roadside ambush"></label>
<label style="margin-top:8px">Notes<textarea id="nb" rows="4"></textarea></label>
<div class="row" style="margin-top:8px"><button class="btn" data-act="addn">Save note</button></div>
</div>
<div id="nlist" class="card"></div>
<div id="questbox"><h2>Quest log</h2>
<div class="card">
<div class="row"><label>New quest<input id="qt" placeholder="Find the missing caravan"></label><button class="btn" data-act="addq">Add quest</button></div>
<div id="qlist"></div>
</div></div>
</section>
<section id="party"></section>
<section id="tools">
<h2>Generators</h2>
<div class="card"><div class="row"><button class="btn" data-gen="npc">NPC</button><button class="btn" data-gen="loot">Loot</button><button class="btn" data-gen="tav">Tavern</button></div><div id="gen" style="font-size:1.1rem">Tap a button to generate.</div></div>
<h2>Monster library</h2>
<div class="card"><label>Search<input id="msr" placeholder="goblin"></label><div id="mlist" style="margin-top:8px"></div><div id="monmsg" class="mu"></div></div>
<h2>Backup and transfer</h2>
<div class="card"><p class="mu">Export your data here, copy it, then paste it on another device and tap Import.</p><textarea id="bk" rows="4"></textarea><div class="row" style="margin-top:8px"><button class="ghost" data-bk="out">Export</button><button class="btn" data-bk="in">Import</button></div></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='table-companion-v1';
let S={char:{name:'',cls:'',lvl:1,ab:{STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10},hp:10,max:10,ac:10,spd:30,inv:'',spells:''},init:{round:1,turn:0,list:[]},notes:[],quests:[],hist:[]};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);S=Object.assign(S,p);S.char=Object.assign(S.char,p.char||{})}}catch(e){}
const newChar=()=>({name:'',cls:'',lvl:1,ab:{STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10},hp:10,max:10,ac:10,spd:30,inv:'',spells:''});
// saved characters (up to 5) live in this browser; the one being played is kept in step with the sheet
const CH={list(){try{const a=JSON.parse(localStorage.getItem('tc-chars')||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&x.c&&typeof x.c==='object').slice(0,5):[]}catch(e){return[]}},put(a){try{localStorage.setItem('tc-chars',JSON.stringify(a.slice(0,5)))}catch(e){}},active:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(CH.active){const a=CH.list(),x=a.find(z=>z.id===CH.active);if(x){x.c=S.char;CH.put(a)}}if(window.PARTY)PARTY.queue()};
function openTab(id){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id))}
const mod=v=>Math.floor((v-10)/2), fm=m=>(m>=0?'+':'')+m, pb=()=>2+Math.floor((S.char.lvl-1)/4);
const d=n=>1+Math.floor(Math.random()*n);

// Dice
let die=20;
$('#dgrid').innerHTML=[4,6,8,10,12,20,100].map(n=>`<button data-die="${n}" class="${n===20?'sel':''}">d${n}</button>`).join('');
function show(total,detail,label){
  $('#res').textContent=total;$('#resd').textContent=detail;
  S.hist.unshift(`${label}: ${total} (${detail})`);S.hist=S.hist.slice(0,12);save();renderHist();
}
function rollDice(n,s,m,mode,label){
  if(mode&&s===20){
    const a=d(20),b=d(20),pick=mode==='adv'?Math.max(a,b):Math.min(a,b);
    show(pick+m,`${a}, ${b} → ${pick}${m?' '+fm(m):''} (${mode==='adv'?'advantage':'disadvantage'})`,label||'d20');return pick+m;
  }
  const r=Array.from({length:n},()=>d(s)),sum=r.reduce((x,y)=>x+y,0);
  show(sum+m,`${r.join(' + ')}${m?' '+fm(m):''}`,label||`${n}d${s}`);return sum+m;
}
function renderHist(){$('#hist').innerHTML=S.hist.length?S.hist.map(h=>`<div>${esc(h)}</div>`).join(''):'<span class="mu">No rolls yet.</span>'}

// Character
function renderChar(){
  const c=S.char;
  $('#char').innerHTML=(window.PARTY?PARTY.slotsHtml():'')+`<div class="card"><div class="row">
  <label>Name<input data-c="name" value="${esc(c.name)}"></label>
  <label>Class<input data-c="cls" value="${esc(c.cls)}"></label>
  <label style="max-width:90px;min-width:80px">Level<input type="number" min="1" max="20" data-c="lvl" value="${c.lvl}"></label></div>
  <span class="mu">Proficiency bonus </span><b id="pb">${fm(pb())}</b></div>
  <h2>Abilities</h2><div class="abs">${Object.keys(c.ab).map(k=>`<div class="ab"><span>${k}</span><input type="number" data-a="${k}" value="${c.ab[k]}"><b id="m${k}">${fm(mod(c.ab[k]))}</b><button class="ghost" data-chk="${k}">Roll ${k} check</button></div>`).join('')}</div>
  <div class="mu" id="chkres" style="margin-top:6px;min-height:1.4em"></div>
  <h2>Health and defense</h2><div class="card">
  <div class="hpb"><label style="min-width:70px">HP<input type="number" data-c="hp" value="${c.hp}"></label><label style="min-width:70px">Max HP<input type="number" data-c="max" value="${c.max}"></label>
  <label style="min-width:70px">AC<input type="number" data-c="ac" value="${c.ac}"></label><label style="min-width:70px">Speed<input type="number" data-c="spd" value="${c.spd}"></label></div>
  <div class="hpb" style="margin-top:10px">${[-5,-1,1,5].map(n=>`<button class="ghost" data-hp="${n}">${n>0?'+':''}${n} HP</button>`).join('')}<button class="ghost" data-act="rest">Long rest</button></div></div>
  <h2>Inventory</h2><textarea rows="5" data-c="inv" placeholder="Longsword, 50 ft rope, 12 gp…">${esc(c.inv)}</textarea>
  <h2>Spells and features</h2><textarea rows="5" data-c="spells">${esc(c.spells)}</textarea>`;
}

// Combat
function renderCombat(){
  const I=S.init;I.list.sort((a,b)=>b.i-a.i);
  if(I.turn>=I.list.length)I.turn=0;
  $('#rnd').textContent='Round '+I.round;
  $('#clist').innerHTML=I.list.length?I.list.map((x,n)=>`<div class="it ${n===I.turn?'cur':''}">
  <div class="nm">${esc(x.n)}<div class="mu" style="font-weight:400">Initiative ${x.i} · HP ${x.hp}${x.hp<=0?' · down':''}</div></div>
  <input type="number" id="amt${n}" placeholder="Amt" aria-label="Amount for ${esc(x.n)}">
  <button class="ghost" data-dmg="${n}">Damage</button><button class="ghost" data-heal="${n}">Heal</button>
  <button class="danger" data-del="${n}" aria-label="Remove ${esc(x.n)}">✕</button></div>`).join(''):'<p class="mu">No one in the fight yet. Add combatants above.</p>';
  save();
}

// Campaign
function renderCamp(){
  $('#nlist').innerHTML=S.notes.length?S.notes.map((n,i)=>`<details><summary>${esc(n.t||'Untitled')}</summary><p style="white-space:pre-wrap">${esc(n.b)}</p><button class="ghost" data-shn="${i}">${n.sh?'Shared with party':'Share with party'}</button> <button class="danger" data-deln="${i}">Delete note</button></details>`).join(''):'<span class="mu">No session notes yet.</span>';
  $('#qlist').innerHTML=S.quests.length?S.quests.map((q,i)=>`<div class="q"><input type="checkbox" data-q="${i}" ${q.d?'checked':''} aria-label="Done"><span class="${q.d?'done':''}" style="flex:1">${esc(q.t)}</span><button class="ghost" data-shq="${i}">${q.sh?'Shared':'Share'}</button><button class="danger" data-delq="${i}" aria-label="Delete quest">✕</button></div>`).join(''):'<span class="mu">No quests yet.</span>';
  save();
}

// Events
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.tab){openTab(D.tab);return}
  if(D.die){die=+D.die;document.querySelectorAll('#dgrid button').forEach(b=>b.classList.toggle('sel',b===t));return}
  if(D.chk){const k=D.chk,m=mod(S.char.ab[k]);const r=rollDice(1,20,m,null,k+' check');$('#chkres').textContent=`${k} check: ${r}`;return}
  if(D.hp){const c=S.char;c.hp=Math.max(0,Math.min(c.max,c.hp+ +D.hp));document.querySelector('[data-c=hp]').value=c.hp;save();return}
  if(D.dmg!==undefined||D.heal!==undefined){const n=+(D.dmg??D.heal),a=Math.abs(+$('#amt'+n).value||0),x=S.init.list[n];x.hp+=D.dmg!==undefined?-a:a;renderCombat();return}
  if(D.del){S.init.list.splice(+D.del,1);renderCombat();return}
  if(D.deln){S.notes.splice(+D.deln,1);renderCamp();return}
  if(D.delq){S.quests.splice(+D.delq,1);renderCamp();return}
  switch(D.act){
    case'roll':rollDice(Math.max(1,Math.min(20,+$('#dn').value||1)),die,+$('#dm').value||0);break;
    case'adv':case'dis':rollDice(1,20,+$('#dm').value||0,D.act);break;
    case'rest':S.char.hp=S.char.max;renderChar();save();break;
    case'addc':{const n=$('#cn').value.trim();if(!n)return;S.init.list.push({n,i:+$('#ci').value||0,hp:+$('#ch').value||0});$('#cn').value=$('#ci').value=$('#ch').value='';renderCombat();break}
    case'rollinit':$('#ci').value=d(20);break;
    case'next':if(S.init.list.length){S.init.turn++;if(S.init.turn>=S.init.list.length){S.init.turn=0;S.init.round++}}renderCombat();break;
    case'resetc':S.init={round:1,turn:0,list:[]};renderCombat();break;
    case'addn':{const b=$('#nb').value.trim(),n=$('#nt').value.trim();if(!b&&!n)return;S.notes.unshift({t:n,b});$('#nt').value=$('#nb').value='';renderCamp();break}
    case'addq':{const q=$('#qt').value.trim();if(!q)return;S.quests.push({t:q,d:false});$('#qt').value='';renderCamp();break}
  }
});
document.addEventListener('change',e=>{if(e.target.dataset.q!==undefined){S.quests[+e.target.dataset.q].d=e.target.checked;renderCamp()}});
document.addEventListener('input',e=>{
  const t=e.target,c=S.char;
  if(t.dataset.a){c.ab[t.dataset.a]=+t.value||0;$('#m'+t.dataset.a).textContent=fm(mod(c.ab[t.dataset.a]));save()}
  else if(t.dataset.c){const k=t.dataset.c;c[k]=t.type==='number'?(+t.value||0):t.value;
    if(k==='lvl'){c.lvl=Math.max(1,Math.min(20,c.lvl||1));$('#pb').textContent=fm(pb())}save()}
});
// Tools
const L=s=>s.split(','),pick=a=>a[Math.floor(Math.random()*a.length)];
const FN=L('Aldric,Brenna,Corin,Dara,Eldon,Fenna,Garrick,Hilda,Isolde,Joren,Kaela,Lorcan,Maren,Nyx,Orrin,Petra,Quill,Rhea,Soren,Tamsin'),LN=L('Ashford,Blackwood,Cinderfall,Dunmere,Evenstar,Frostmantle,Greyhollow,Ironvale,Thornwick,Underhill'),TR=L('gruff,cheerful,suspicious,nervous,pompous,soft-spoken,greedy,devout,curious,world-weary'),RC=L('human,elf,dwarf,halfling,gnome,half-orc,tiefling,dragonborn'),JB=L('blacksmith,innkeeper,merchant,guard captain,herbalist,priest,thief,scholar,ferryman,farmer'),QK=L('never makes eye contact,hums constantly,collects teeth,speaks in proverbs,is terrified of cats,overtips,quotes a long-dead hero,keeps a pet crow'),WT=L('revenge on a rival,safe passage out of town,to find a lost sibling,a rare book,quick gold,to keep a dark secret hidden'),LT=L('a silver ring that glows near undead,a potion of healing,a rusted key with no lock,a map to a nearby ruin,a pouch of 40 gold pieces,a dagger with a ruby pommel,a scroll with one unknown spell,a cracked crystal ball,a set of masterwork thieves’ tools,a mysterious egg wrapped in cloth'),T1=L('Gilded,Drunken,Sleeping,Rusty,Laughing,Crimson,Silver,Broken'),T2=L('Dragon,Goblet,Anvil,Stag,Lantern,Raven,Barrel,Crown');
const GEN={npc:()=>`${pick(FN)} ${pick(LN)}, a ${pick(TR)} ${pick(RC)} ${pick(JB)}. Quirk: ${pick(QK)}. Wants: ${pick(WT)}.`,loot:()=>`You find ${pick(LT)}.`,tav:()=>`The ${pick(T1)} ${pick(T2)}`};
const MON=[['Goblin','1/4',7,15,'Scimitar +4, 1d6+2'],['Wolf','1/4',11,13,'Bite +4, 2d4+2, pack tactics'],['Skeleton','1/4',13,13,'Shortsword +4, 1d6+2'],['Zombie','1/4',22,8,'Slam +3, 1d6+1, hard to put down'],['Bandit','1/8',11,12,'Scimitar +3, 1d6+1'],['Orc','1/2',15,13,'Greataxe +5, 1d12+3'],['Giant Spider','1',26,14,'Bite +5, poison, webs'],['Ogre','2',59,11,'Greatclub +6, 2d8+4'],['Owlbear','3',59,13,'Beak and claws, multiattack'],['Troll','5',84,15,'Regenerates, multiattack'],['Wyvern','6',110,13,'Bite and poison stinger']];
function renderMon(){const q=$('#msr').value.toLowerCase();$('#mlist').innerHTML=MON.map((m,i)=>m[0].toLowerCase().includes(q)?`<div class="it"><div class="nm">${m[0]}<div class="mu" style="font-weight:400">CR ${m[1]} · HP ${m[2]} · AC ${m[3]} · ${m[4]}</div></div><button class="ghost" data-mon="${i}">Add to combat</button></div>`:'').join('')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
 if(D.gen){$('#gen').textContent=GEN[D.gen]()}
 else if(D.mon!==undefined){const m=MON[+D.mon],n=S.init.list.filter(x=>x.n.startsWith(m[0])).length+1;S.init.list.push({n:`${m[0]} ${n}`,i:d(20),hp:m[2]});renderCombat();$('#monmsg').textContent=`${m[0]} ${n} added to the Combat tab.`}
 else if(D.bk==='out'){$('#bk').value=JSON.stringify(S)}
 else if(D.bk==='in'){try{const p=JSON.parse($('#bk').value);S=Object.assign(S,p);save();renderChar();renderCombat();renderCamp();renderHist();$('#bk').value='Imported.'}catch(err){$('#bk').value='That doesn’t look like exported data.'}}
});
$('#msr').addEventListener('input',renderMon);

// Party: the host runs server.js on their PC. Friends use this page (or the host's own link)
// and connect to that server, usually through an invite link that carries the server address.
const PARTY=window.PARTY=(()=>{
  const SIDES=[4,6,8,10,12,20,100];
  let mode='idle',avail=null,view=null,msg='',timer=null,draft='',token='',hostKey='',pend=false,cr=false,gen=0,base='',rl={n:1,s:20,m:0,k:'n'},step='code',okCode='',nc={n:'',c:'',l:1},delId='',lastRole='';
  const okBase=s=>/^(https:\/\/[a-z0-9.-]+|http:\/\/(localhost|127\.0\.0\.1))(:\d{1,5})?$/i.test(s);
  try{draft=localStorage.getItem('tc-code')||''}catch(e){}
  try{
    const u=new URL(location.href),k=u.searchParams.get('host');
    if(k){hostKey=k.slice(0,80);u.searchParams.delete('host');history.replaceState(null,'',u.pathname+u.search+u.hash);try{sessionStorage.setItem('tc-hk',hostKey)}catch(e){}}
    else{try{hostKey=sessionStorage.getItem('tc-hk')||''}catch(e){}}
  }catch(e){}
  try{
    // an invite link looks like  page#s=<server address>&c=<party code>
    const h=new URLSearchParams(location.hash.replace(/^#/,'')),s=(h.get('s')||'').replace(/\/+$/,''),c=h.get('c')||'';
    if(!hostKey){
      if(okBase(s)){base=s;try{localStorage.setItem('tc-srv',s)}catch(e){}}
      else{try{const st=localStorage.getItem('tc-srv')||'';if(okBase(st))base=st}catch(e){}}
    }
    if(/^[A-Za-z0-9]{5}$/.test(c))draft=c.toUpperCase();
    if(h.has('s')||h.has('c'))history.replaceState(null,'',location.pathname+location.search);
  }catch(e){}
  const cl=(s,n)=>String(s==null?'':s).slice(0,n);
  const num=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(+v||0)));
  const arr=a=>Array.isArray(a)?a:[];
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const info=m=>({name:cl(m.name,30)||'Adventurer',cls:cl(m.cls,30),lvl:num(m.lvl,1,20),hp:num(m.hp,-999,9999),max:num(m.max,0,9999),ac:num(m.ac,0,99)});
  const mine=()=>info(S.char);
  const role=()=>hostKey?'host':mode==='player'?'player':(base||avail)?'gate':'solo';
  function applyRole(){
    const r=role();if(r===lastRole)return;lastRole=r;
    document.body.dataset.role=r;
    const nav=document.querySelector('nav'),pb=nav.querySelector('[data-tab=party]');
    if(r==='player'||r==='gate'){nav.prepend(pb);openTab('party')}
    else nav.insertBefore(pb,nav.querySelector('[data-tab=tools]'));
    renderChar();
  }
  const say=t=>{msg=t;render()};
  const where=()=>{try{return base?new URL(base).host:''}catch(e){return ''}};
  async function api(p,body){
    const r=await fetch(base+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw Object.assign(new Error(j.error||'Request failed.'),{status:r.status});
    return j;
  }
  const shared=()=>({who:cl(S.char.name,30),round:num(S.init.round,1,9999),turn:num(S.init.turn,0,999),
    init:S.init.list.map(x=>({n:cl(x.n,40),i:num(x.i,-99,99),down:x.hp<=0})),
    quests:S.quests.filter(q=>q.sh).map(q=>({t:cl(q.t,200),d:!!q.d})),
    notes:S.notes.filter(n=>n.sh).map(n=>({t:cl(n.t,100),b:cl(n.b,3000)}))});
  function clean(m,isHost){
    m=m&&typeof m==='object'?m:{};
    const o={code:cl(m.code,8),round:num(m.round,1,9999),turn:num(m.turn,0,999),
      feed:arr(m.feed).slice(0,30).map(x=>({w:cl(x&&x.w,30),t:cl(x&&x.t,140),hid:isHost&&!!(x&&x.hid)})),
      init:arr(m.init).slice(0,60).map(x=>({n:cl(x&&x.n,40),i:num(x&&x.i,-99,99),down:!!(x&&x.down)})),
      roster:arr(m.roster).slice(0,16).map(x=>Object.assign({id:isHost?cl(x&&x.id,40):'',on:!(x&&x.on===false)},info(x||{}))),
      quests:arr(m.quests).slice(0,60).map(x=>({t:cl(x&&x.t,200),d:!!(x&&x.d)})),
      notes:arr(m.notes).slice(0,60).map(x=>({t:cl(x&&x.t,100),b:cl(x&&x.b,3000)}))};
    if(isHost){o.site=cl(m.site,300);o.publicUrl=okBase(cl(m.publicUrl,200))?cl(m.publicUrl,200):''}
    return o;
  }
  const stopLoop=()=>{gen++};
  function queue(){
    if(mode==='idle')return;
    clearTimeout(timer);
    timer=setTimeout(()=>{
      if(mode==='host')api('/api/host/state',Object.assign({key:hostKey},shared())).catch(()=>{});
      else if(mode==='player')api('/api/upd',Object.assign({token},mine())).catch(()=>{});
    },200);
  }
  function dead(kind){
    if(kind==='host'){stopLoop();mode='idle';view=null;hostKey='';try{sessionStorage.removeItem('tc-hk')}catch(e){}msg='The server did not accept this host link. Start the server again and use the link it opens.';render()}
    else leave('You were disconnected from the party. Join again.');
  }
  // Live updates: ask the server for news; it answers as soon as something changes (or after ~25s).
  async function loop(kind){
    const my=++gen;let v=0,fail=0,pushed=false;
    while(my===gen){
      try{
        if(kind==='host'&&!pushed){await api('/api/host/state',Object.assign({key:hostKey},shared()));pushed=true}
        const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);
        const url=kind==='host'?'/api/host/poll?key='+encodeURIComponent(hostKey)+'&v='+v:'/api/poll?token='+encodeURIComponent(token)+'&v='+v;
        let r;try{r=await fetch(base+url,{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(tm)}
        if(my!==gen)return;
        if(r.status===401){dead(kind);return}
        if(!r.ok)throw new Error('http '+r.status);
        const j=await r.json();
        if(my!==gen)return;
        if(fail){fail=0;pushed=false}
        if(j.kicked){leave(j.kicked==='kicked'?'The host removed you from the party.':j.kicked==='reset'?'The host started a new party. Ask for the new code.':'');return}
        if(j.state){v=j.v;view=clean(j.state,kind==='host');msg='';render()}
      }catch(e){
        if(my!==gen)return;
        if(e&&e.status===401){dead(kind);return}
        fail++;msg=kind==='host'?'Reconnecting to your server…':'Reconnecting…';render();
        await sleep(Math.min(1000*fail,5000));
      }
    }
  }
  function startHost(){mode='host';view=null;msg='Connecting to your server…';render();loop('host')}
  async function join(raw){
    const c=cl(raw,12).toUpperCase().replace(/[^A-Z0-9]/g,'');
    draft=c;
    if(c.length!==5){say('Enter the 5-character party code.');return}
    if(!S.char.name.trim()){step='pick';say('Pick or create a character first.');return}
    msg='Joining…';render();
    try{
      const j=await api('/api/join',Object.assign({code:c},mine()));
      token=j.token;mode='player';view=null;
      try{localStorage.setItem('tc-code',c)}catch(e){}
      msg='Connecting…';render();loop('player');
    }catch(e){
      if(e.status===403||e.status===429){step='code';okCode='';CH.active=''}
      else if(e.status){step='pick';CH.active=''}
      say(e.status?e.message:'Could not reach the host\'s server. Check the invite link, or ask the host if the server is still running.')
    }
  }
  function leave(text){
    stopLoop();
    if(token){api('/api/leave',{token}).catch(()=>{})}
    token='';mode='idle';view=null;msg=text||'';step='code';okCode='';CH.active='';render();
  }
  async function check(raw){
    const c=cl(raw,12).toUpperCase().replace(/[^A-Z0-9]/g,'');
    draft=c;
    if(c.length!==5){say('Enter the 5-character party code.');return}
    msg='Checking the code…';render();
    try{await api('/api/join',{code:c,check:true});okCode=c;step='pick';msg='';render()}
    catch(e){say(e.status?e.message:'Could not reach the host\'s server. Check the invite link, or ask the host if the server is still running.')}
  }
  function play(id){
    const x=CH.list().find(z=>z.id===id);if(!x)return;
    const c=Object.assign(newChar(),x.c);c.ab=Object.assign(newChar().ab,x.c.ab||{});
    S.char=c;CH.active=id;save();renderChar();join(okCode);
  }
  function create(){
    const n=cl(nc.n,30).trim();
    if(!n){say('Give your character a name.');return}
    const a=CH.list();
    if(a.length>=5){say('You have 5 characters. Delete one to make a new one.');return}
    if(a.some(x=>String(x.c.name).toLowerCase()===n.toLowerCase())){say('You already have a character with that name.');return}
    const c=newChar();c.name=n;c.cls=cl(nc.c,30);c.lvl=num(nc.l,1,20);
    const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    a.push({id,c});CH.put(a);nc={n:'',c:'',l:1};play(id);
  }
  const who=c=>`${esc(c.name||'Unnamed')}<div class="mu" style="font-weight:400">${esc(c.cls||'')}${c.cls?' · ':''}lvl ${num(c.lvl,1,20)}</div>`;
  function slotsHtml(){
    if(role()!=='player')return '';
    const a=CH.list();
    return `<div class="card"><h2 style="margin:0 0 8px">My characters (${a.length}/5)</h2>${a.map(x=>`<div class="it"><div class="nm">${who(x.c)}</div>${x.id===CH.active?'<span class="mu">playing</span>':`<button class="danger" data-pty="delc" data-id="${esc(x.id)}">${delId===x.id?'Tap again to delete':'Delete'}</button>`}</div>`).join('')}<p class="mu" style="margin:6px 0 0">Saved in this browser on this device. Leave the party to switch characters or make a new one.</p></div>`;
  }
  function pickHtml(){
    const a=CH.list();
    return `<div class="card"><h2 style="margin-top:0">Choose your character</h2><p class="mu">Party <b>${esc(okCode)}</b>. Your name, class, HP and AC are shared with the party. Characters are saved in this browser (up to 5).</p>${a.length?a.map(x=>`<div class="it"><div class="nm">${who(x.c)}</div><button class="btn" data-pty="play" data-id="${esc(x.id)}">Play</button><button class="danger" data-pty="delc" data-id="${esc(x.id)}">${delId===x.id?'Tap again':'Delete'}</button></div>`).join(''):'<p class="mu">No saved characters yet. Make your first one below.</p>'}</div>`+
      (a.length<5?`<div class="card"><h2 style="margin-top:0">New character</h2><div class="row"><label>Name<input id="ncn" maxlength="30" autocomplete="off" value="${esc(nc.n)}"></label><label>Class<input id="ncc" maxlength="30" autocomplete="off" value="${esc(nc.c)}"></label><label style="max-width:90px;min-width:80px">Level<input id="ncl" type="number" min="1" max="20" value="${esc(nc.l)}"></label></div><button class="btn" data-pty="create">Create and join</button><p class="mu" style="margin:8px 0 0">You can fill in the rest of the sheet on the Character tab.</p></div>`:'<div class="card"><p class="mu" style="margin:0">You have 5 characters. Delete one to make a new one.</p></div>')+
      '<button class="ghost" data-pty="back">Back</button>';
  }
  function ping(){
    avail=null;render();
    fetch(base+'/api/ping',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{avail=!!(j&&j.ok);if(avail&&hostKey&&!base)startHost();else render()}).catch(()=>{avail=false;render()});
  }
  function readRl(){
    const g=id=>document.getElementById(id);
    if(g('rn'))rl.n=num(g('rn').value||1,1,20);
    if(g('rs'))rl.s=SIDES.includes(+g('rs').value)?+g('rs').value:20;
    if(g('rm'))rl.m=num(g('rm').value,-99,99);
    if(g('rk'))rl.k=['n','a','d'].includes(g('rk').value)?g('rk').value:'n';
  }
  function rollCard(isHost){
    const o=SIDES.map(s=>`<option value="${s}" ${rl.s===s?'selected':''}>d${s}</option>`).join('');
    const kk=[['n','Normal'],['a','Advantage (d20)'],['d','Disadvantage (d20)']].map(x=>`<option value="${x[0]}" ${rl.k===x[0]?'selected':''}>${x[1]}</option>`).join('');
    return `<h2>Dice</h2><div class="card"><div class="row"><label>How many<input id="rn" type="number" min="1" max="20" value="${rl.n}"></label><label>Die<select id="rs">${o}</select></label><label>Modifier<input id="rm" type="number" value="${rl.m}"></label><label>Type<select id="rk">${kk}</select></label></div><div class="row" style="margin:0"><button class="btn" data-pty="roll">Roll for the party</button>${isHost?'<button class="ghost" data-pty="rollh">Roll hidden (only you see it)</button>':''}</div></div>`;
  }
  function feedHtml(v){
    return `<h2>Rolls</h2><div class="card" id="pfeed">${v.feed.length?v.feed.map(x=>`<div class="fd"><b>${esc(x.w)}</b> ${esc(x.t)}${x.hid?' <span class="mu">(hidden)</span>':''}</div>`).join(''):'<span class="mu">No rolls yet. Rolls from everyone show up here.</span>'}</div>`;
  }
  function bodyShared(v,isHost){
    const tn=v.init.length?v.turn%v.init.length:0;
    const ro=v.roster.length?v.roster.map(r=>{
      const pct=r.max>0?Math.max(0,Math.min(100,Math.round(r.hp/r.max*100))):0;
      return `<div class="pm ${r.on?'':'off'}"><div class="top"><b>${esc(r.name)}</b><span class="mu">${esc(r.cls)}${r.cls?' ':''}${r.lvl?'lvl '+r.lvl:''}${r.on?'':' · offline'}</span>${isHost?`<button class="danger" data-pty="kick" data-id="${esc(r.id)}" aria-label="Remove ${esc(r.name)}">✕</button>`:''}</div>
      <div>HP ${r.hp}/${r.max} · AC ${r.ac}</div><div class="bar"><i class="${pct<=25?'low':''}" style="width:${pct}%"></i></div></div>`}).join(''):'<p class="mu">No players have joined yet.</p>';
    const ini=v.init.length?v.init.map((x,n)=>`<div class="it ${n===tn?'cur':''}"><div class="nm">${esc(x.n)}</div><span class="mu">${x.down?'down · ':''}${x.i}</span></div>`).join(''):'<p class="mu">No encounter running.</p>';
    const qs=v.quests.length?v.quests.map(q=>`<div class="q"><span class="${q.d?'done':''}">${q.d?'✓ ':''}${esc(q.t)}</span></div>`).join(''):'<p class="mu">Nothing shared yet.</p>';
    const ns=v.notes.length?v.notes.map(n=>`<details><summary>${esc(n.t||'Untitled')}</summary><p style="white-space:pre-wrap">${esc(n.b)}</p></details>`).join(''):'<p class="mu">Nothing shared yet.</p>';
    return rollCard(isHost)+feedHtml(v)+`<h2>Party</h2>${ro}<h2>Turn order · round ${v.round}</h2>${ini}<h2>Quests</h2><div class="card">${qs}</div><h2>${isHost?'Shared notes':'Notes from the host'}</h2><div class="card">${ns}</div>`;
  }
  const inviteLink=v=>v&&v.publicUrl&&v.site?v.site+'#s='+encodeURIComponent(v.publicUrl)+'&c='+v.code:'';
  function inviteCard(v){
    const l=inviteLink(v);
    if(l)return `<div class="card"><h2 style="margin-top:0">Invite link</h2><p class="mu">Send this to your friends. It opens the website and fills in your server and the party code.</p><input id="inv" readonly value="${esc(l)}" aria-label="Invite link"><div class="row" style="margin:8px 0 0"><button class="btn" data-pty="copyinv">Copy invite link</button><button class="ghost" data-pty="clearpub">Change public link</button></div></div>`;
    return `<div class="card"><h2 style="margin-top:0">Public link</h2><p class="mu">Friends can't reach your PC yet. start.bat tries to open a free public link by itself (nothing to install on Windows 10/11) and the invite link appears here when it's ready. If it can't, paste any https tunnel link here.</p><div class="row" style="margin:0"><label>Public https link<input id="purl" placeholder="https://something.lhr.life" autocomplete="off" spellcheck="false"></label><button class="btn" data-pty="savepub">Save</button></div></div>`;
  }
  function render(){
    applyRole();
    const el=document.getElementById('party');if(!el)return;
    const ae=document.activeElement;
    if(mode!=='idle'&&ae&&el.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')){pend=true;return}
    pend=false;
    const st=msg?`<div class="mu" role="status" style="margin:8px 0">${esc(msg)}</div>`:'';
    if(mode==='idle'){
      if(avail===null){el.innerHTML='<p class="mu">Checking for the party server…</p>'}
      else if(!avail){
        el.innerHTML=base
          ?`<div class="card"><h2 style="margin-top:0">Can't reach the host</h2><p class="mu">The server at <b>${esc(where())}</b> did not answer. The host may have stopped it, or their link changed. Ask them for a new invite link.</p><button class="ghost" data-pty="forget">Forget this server</button></div>${st}`
          :`<div class="card"><h2 style="margin-top:0">Party play</h2><p class="mu">Parties run on the host's own computer. Players: open the invite link your host sent you. Hosts: run <b>start.bat</b> from your DND folder and use the host link it opens.</p></div>${st}`;
      }else{
        el.innerHTML=step==='pick'&&okCode
          ?pickHtml()+st
          :`<div class="card"><h2 style="margin-top:0">Join the party</h2>${base?`<p class="mu">Host's server: <b>${esc(where())}</b></p>`:''}<p class="mu">Enter the party code from your host. Then you pick or create your character.</p><div class="row"><label>Party code<input id="pcode" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" value="${esc(draft)}"></label><button class="btn" data-pty="check">Continue</button></div>${base?'<button class="ghost" data-pty="forget">Use a different server</button>':''}</div>${st}`;
      }
    }else if(mode==='host'){
      el.innerHTML=`<div class="card"><div class="mu" style="text-align:center">Party code</div><div class="pcode" id="pshow">${esc(view?view.code:'…')}</div><div class="row" style="justify-content:center"><button class="ghost" data-pty="copy">Copy code</button><button class="ghost" data-pty="reset">${cr?'Tap again to remove everyone':'New code'}</button></div><p class="mu" style="text-align:center;margin:0">Turn order shows names only, never monster health. Share quests and notes from the Campaign tab. Closing the server window ends the party.</p></div>${view?inviteCard(view):''}${st}${view?bodyShared(view,true):''}`;
    }else{
      el.innerHTML=`<div class="card"><div class="row" style="margin:0"><b style="flex:1">Party ${esc(view?view.code:'')}</b><button class="danger" data-pty="leave">Leave party</button></div></div>${st}${view?bodyShared(view,false):''}`;
    }
  }
  const copy=(text,done)=>{try{navigator.clipboard.writeText(text).then(()=>say(done),()=>say('Could not copy. Select it and copy by hand.'))}catch(err){say('Could not copy. Select it and copy by hand.')}};
  document.addEventListener('click',async e=>{
    const t=e.target.closest('button');if(!t)return;const D=t.dataset;
    if(D.shq!==undefined){const q=S.quests[+D.shq];if(q){q.sh=!q.sh;renderCamp()}return}
    if(D.shn!==undefined){const n=S.notes[+D.shn];if(n){n.sh=!n.sh;renderCamp()}return}
    if(!D.pty)return;
    const fail=err=>say(err.status?err.message:'Could not reach your server.');
    if(D.pty==='check'){const i=document.getElementById('pcode');check(i?i.value:draft)}
    else if(D.pty==='play')play(D.id);
    else if(D.pty==='create')create();
    else if(D.pty==='back'){step='code';okCode='';msg='';render()}
    else if(D.pty==='delc'){
      if(delId!==D.id){delId=D.id;render();renderChar();setTimeout(()=>{if(delId===D.id){delId='';render();renderChar()}},4000);return}
      delId='';CH.put(CH.list().filter(x=>x.id!==D.id));if(CH.active===D.id)CH.active='';render();renderChar();
    }
    else if(D.pty==='leave')leave('');
    else if(D.pty==='forget'){base='';try{localStorage.removeItem('tc-srv')}catch(e){}msg='';ping()}
    else if(D.pty==='kick'){try{await api('/api/host/kick',{key:hostKey,id:D.id})}catch(err){fail(err)}}
    else if(D.pty==='reset'){
      if(!cr){cr=true;render();setTimeout(()=>{if(cr){cr=false;render()}},4000);return}
      cr=false;
      try{await api('/api/host/reset',{key:hostKey});say('New code created.')}catch(err){fail(err)}
    }
    else if(D.pty==='copy')copy(view?view.code:'','Code copied.');
    else if(D.pty==='copyinv')copy(inviteLink(view),'Invite link copied.');
    else if(D.pty==='savepub'){const i=document.getElementById('purl');try{await api('/api/host/public',{key:hostKey,url:i?i.value:''});say('')}catch(err){fail(err)}}
    else if(D.pty==='clearpub'){try{await api('/api/host/public',{key:hostKey,url:''});say('')}catch(err){fail(err)}}
    else if(D.pty==='roll'||D.pty==='rollh'){
      readRl();
      const b={n:rl.n,s:rl.s,m:rl.m,k:rl.k};
      try{
        if(mode==='host')await api('/api/host/roll',Object.assign({key:hostKey,who:S.char.name.trim()||'DM',hid:D.pty==='rollh'},b));
        else if(mode==='player')await api('/api/roll',Object.assign({token},b));
      }catch(err){fail(err)}
    }
  });
  document.addEventListener('input',e=>{const i=e.target.id;if(i==='pcode')draft=e.target.value;else if(i==='ncn')nc.n=e.target.value;else if(i==='ncc')nc.c=e.target.value;else if(i==='ncl')nc.l=e.target.value});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pcode')check(e.target.value)});
  document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#party'))readRl()});
  document.addEventListener('focusout',e=>{if(pend&&e.target.closest&&e.target.closest('#party'))setTimeout(render,0)});
  ping();
  return {queue,render,slotsHtml,role,get mode(){return mode}};
})();
renderChar();renderCombat();renderCamp();renderHist();renderMon();PARTY.render();
</script>
